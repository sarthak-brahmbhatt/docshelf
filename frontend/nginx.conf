# nginx site config for the DocShelf frontend container: static SPA with history fallback, /api/ and /actuator/ proxied to the backend service
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large uploads (documents up to the backend's maxUploadMb) and slow LLM-backed requests
    client_max_body_size 256m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Service worker and manifest must never be cached aggressively
    location = /ngsw.json { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }

    # Hashed build assets can be cached for a long time
    location ~* \.(?:js|css|woff2?|png|ico|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
